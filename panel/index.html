<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ai-dev-org 控制面板</title>
<style>
:root{color-scheme:light;--bg:#f3f5f8;--panel:#fff;--panel-2:#f8fafc;--text:#17202b;--muted:#697586;--line:#e2e7ed;--line-strong:#cbd4df;--accent:#356df3;--accent-soft:#edf3ff;--good:#17855b;--good-soft:#eaf8f2;--bad:#cf3f4b;--bad-soft:#fff0f1;--shadow:0 1px 2px #15223808,0 8px 30px #15223806;--drag-shadow:0 18px 42px #2435542b,0 3px 10px #24355418}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0e1218;--panel:#151b23;--panel-2:#11171e;--text:#e8edf4;--muted:#919dad;--line:#28313d;--line-strong:#3a4655;--accent:#78a0ff;--accent-soft:#1b2943;--good:#55d7a5;--good-soft:#132b25;--bad:#ff8992;--bad-soft:#351d24;--shadow:0 1px 2px #0005,0 12px 36px #0003;--drag-shadow:0 20px 48px #0008,0 3px 12px #0005}}
*{box-sizing:border-box}
html{min-width:320px;background:var(--bg)}
body{margin:0;min-height:100vh;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:radial-gradient(900px 360px at 50% -120px,var(--accent-soft),transparent 72%),var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit}
button,[tabindex]{-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{width:min(1240px,100%);margin:auto;padding:34px 24px 56px}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.eyebrow{margin:0 0 7px;color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase}
h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0;font-size:25px;line-height:1.25;letter-spacing:-.025em}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:25px;padding:3px 9px;border:1px solid transparent;border-radius:999px;font-size:11px;font-weight:700;line-height:1.2;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.sub{margin:9px 0 0;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.local-note{flex:none;margin-top:23px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted);background:color-mix(in srgb,var(--panel) 75%,transparent);font-size:11px}
.status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.status-card,.role-card,.operations{border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.status-card{min-width:0;padding:16px 17px}
.status-top{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
.clean-state{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650}
.clean-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good)}
.clean-state.dirty{color:var(--bad)}.clean-state.dirty::before{background:var(--bad)}
.status-value{overflow:hidden;margin-top:8px;font:650 14px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;text-overflow:ellipsis;white-space:nowrap}
.status-detail{overflow:hidden;margin-top:5px;color:var(--muted);font-size:11px;text-overflow:ellipsis;white-space:nowrap}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:30px 0 12px}
.section-head h2{margin:0;font-size:16px;letter-spacing:-.01em}
.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}
.section-hint{flex:none;color:var(--muted);font-size:11px}
.roles-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.role-card{min-width:0;overflow:hidden}
.role-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px;padding:14px 16px;border-bottom:1px solid var(--line)}
.role-title{display:flex;align-items:center;gap:8px;min-width:0}
.role-title h3{margin:0;font-size:15px;letter-spacing:-.01em}
.role-name{overflow:hidden;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;text-overflow:ellipsis}
.level{padding:2px 6px;border:1px solid var(--line);border-radius:5px;color:var(--muted);font:10px ui-monospace,SFMono-Regular,Consolas,monospace}
.save-state{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:4px 7px;border:0;border-radius:7px;background:transparent;color:var(--good);font-size:11px;white-space:nowrap}
.save-state[data-state="saving"]{color:var(--muted)}
.save-state[data-state="error"]{background:var(--bad-soft);color:var(--bad);cursor:pointer}
.save-state[data-state="error"]:hover{filter:brightness(.97)}
.model-list{position:relative;display:flex;flex-direction:column;gap:6px;max-height:438px;overflow:auto;padding:10px;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;overscroll-behavior:contain}
.model-row{position:relative;display:flex;align-items:center;gap:8px;min-width:0;min-height:65px;padding:8px 8px 8px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:grab;transition:border-color .16s,background .16s,box-shadow .16s;touch-action:pan-y}
.model-row:hover{border-color:var(--line-strong);background:var(--panel-2)}
.model-row:first-child{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(100deg,var(--accent-soft),var(--panel) 45%)}
.model-row.dragging,.model-row.settling{z-index:5;cursor:grabbing;border-color:var(--accent);box-shadow:var(--drag-shadow);background:var(--panel);will-change:transform}
.model-row.dragging{transition:none}
.model-row.drop-before::after,.model-row.drop-after::after{content:"";position:absolute;z-index:8;left:10px;right:10px;height:2px;border-radius:2px;background:var(--accent);pointer-events:none}
.model-row.drop-before::after{top:-5px}.model-row.drop-after::after{bottom:-5px}
.order-no{flex:none;width:18px;color:var(--muted);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center;font-variant-numeric:tabular-nums}
.model-row:first-child .order-no{color:var(--accent);font-weight:800}
.drag-handle{display:grid;place-items:center;flex:none;width:34px;height:36px;margin:-4px 0;border-radius:7px;color:var(--muted);font:20px/1 ui-monospace,monospace;cursor:grab;touch-action:none;user-select:none}
.drag-handle:hover{background:var(--accent-soft);color:var(--accent)}
.row-main{min-width:0;flex:1}
.model-line{display:flex;align-items:center;gap:7px;min-width:0}
.model-name{overflow:hidden;font-size:13px;font-weight:720;letter-spacing:-.01em;text-overflow:ellipsis;white-space:nowrap}
.preferred{display:none;flex:none;padding:1px 6px;border-radius:5px;background:var(--accent);color:#fff;font-size:9px;font-weight:750;letter-spacing:.04em}
.model-row:first-child .preferred{display:inline-flex}
.meta{display:flex;align-items:center;gap:5px;min-width:0;margin-top:5px;color:var(--muted);font-size:10px}
.entry{overflow:hidden;max-width:48%;text-overflow:ellipsis;white-space:nowrap}
.provider{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.chip{display:inline-flex;align-items:center;flex:none;padding:1px 5px;border:1px solid var(--line);border-radius:4px;background:var(--panel);font-size:9px;font-weight:650;line-height:1.35}
.family-glm{border-color:#9dbcf155;background:#eaf2ff;color:#3167c4}.family-kimi{border-color:#c3a9ed66;background:#f3edff;color:#7650b4}.family-deepseek{border-color:#86cbd066;background:#e9f8f8;color:#247b82}
@media(prefers-color-scheme:dark){.family-glm{background:#1b2b45;color:#8cb5ff}.family-kimi{background:#2b2340;color:#c4a5fa}.family-deepseek{background:#173033;color:#82d9df}}
.row-actions{display:flex;flex:none;gap:3px}
.move-btn{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer;font-size:14px}
.move-btn:hover:not(:disabled){border-color:var(--line);background:var(--panel-2);color:var(--text)}
.move-btn:active:not(:disabled){transform:scale(.93)}
.move-btn:disabled{opacity:.25;cursor:default}
.card-foot{display:flex;justify-content:space-between;gap:8px;padding:0 15px 12px;color:var(--muted);font-size:10px}
.operations{margin-top:28px;padding:16px}
.operations .section-head{margin:0 0 13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.action-btn{min-height:36px;padding:7px 13px;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel);color:var(--text);cursor:pointer;font-size:12px;font-weight:600;transition:background .15s,border-color .15s,transform .15s}
.action-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.action-btn:active:not(:disabled){transform:translateY(1px)}
.action-btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}
.action-btn.primary:hover:not(:disabled){filter:brightness(1.06)}
.action-btn:disabled{opacity:.55;cursor:wait}
pre{min-height:90px;max-height:260px;overflow:auto;margin:13px 0 0;padding:13px 14px;border:1px solid #253142;border-radius:10px;background:#0e141c;color:#c9d7e7;font:11px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.is-dragging,.is-dragging *{user-select:none!important;cursor:grabbing!important}
#dead-banner{position:fixed;z-index:50;left:0;right:0;bottom:0;padding:10px 16px;background:#b42332;color:#fff;text-align:center;font-size:13px;box-shadow:0 -4px 18px #0002}
@media(max-width:900px){.roles-grid{grid-template-columns:1fr}.status-grid{grid-template-columns:1fr}.local-note{display:none}.section-hint{display:none}}
@media(max-width:560px){main{padding:24px 12px 46px}.topbar{margin-bottom:18px}h1{font-size:21px}.role-head{padding:12px}.model-list{padding:8px}.model-row{gap:5px}.order-no{width:14px}.drag-handle{width:32px}.role-name{display:none}.entry{max-width:42%}.chip.plan-chip{display:none}.card-foot{padding:0 12px 10px}.operations{padding:13px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="topbar">
    <div>
      <p class="eyebrow">Local orchestration</p>
      <h1>ai-dev-org 控制面板 <span class="badge good" id="v-badge">加载中</span></h1>
      <p class="sub" id="sub">正在读取本机状态…</p>
    </div>
    <div class="local-note">仅本机 · 自动保存</div>
  </header>

  <section class="status-grid" id="cards" aria-label="仓库与配置状态"></section>

  <div class="section-head">
    <div><h2>模型路由（按顺序回退）</h2><p>拖动模型调整优先级，排在首位的模型为当前首选。</p></div>
    <span class="section-hint">拖拽排序 · Alt + ↑ / ↓ 换位 · 500ms 去抖保存</span>
  </div>
  <section id="roles" aria-label="岗位模型路由"></section>

  <section class="operations">
    <div class="section-head"><div><h2>操作与日志</h2><p>查看来源状态，或重新生成本机代理配置。</p></div></div>
    <div class="toolbar">
      <button class="action-btn primary" id="refresh">刷新状态</button>
      <button class="action-btn" id="health">源健康（24h）</button>
      <button class="action-btn" id="sync">重渲染代理文件</button>
    </div>
    <pre id="log" aria-live="polite">就绪。</pre>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const sameOrder = (a,b) => a.length === b.length && a.every((v,i) => v === b[i]);
const stamp = () => new Date().toLocaleTimeString('zh-CN',{hour12:false});
const log = text => { $('log').textContent = `[${stamp()}] ${String(text)}`; };
const clientId = crypto.randomUUID ? crypto.randomUUID() : 'c' + Date.now() + Math.random();
let dead = false;
let drag = null;
const runtimes = new Map();

function markDead(){
  if(dead) return;
  dead = true;
  let banner = $('dead-banner');
  if(!banner){banner=document.createElement('div');banner.id='dead-banner';document.body.appendChild(banner);}
  banner.textContent='面板服务已退出——重新双击桌面「Org 控制面板」即可再次打开';
}
const post = (path,body) => fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
const beat = () => { if(!dead) post('/api/beat',{clientId}).catch(markDead); };
post('/api/hello',{clientId}).catch(markDead);
setInterval(beat,5000);
const bye = () => { try{navigator.sendBeacon('/api/bye',new Blob([JSON.stringify({clientId})],{type:'application/json'}));}catch(e){} };
addEventListener('pagehide',bye);
addEventListener('beforeunload',bye);
async function api(path,body){
  const response = await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);
  return response.json();
}
function familyClass(family){return ['glm','kimi','deepseek'].includes(family)?'family-'+family:'';}
function statusCard(title,git){
  if(!git)return `<article class="status-card"><div class="status-top"><span>${esc(title)}</span><span class="clean-state">未配置</span></div><div class="status-value">—</div><div class="status-detail">ORG_PANEL_PROJECT 未设置时隐藏（入仓参数化版）</div></article>`;
  return `<article class="status-card"><div class="status-top"><span>${esc(title)}</span><span class="clean-state${git.clean?'':' dirty'}">${git.clean?'工作树 clean':'有未提交改动'}</span></div><div class="status-value" title="${esc(git.branch)} · ${esc(git.head)}">${esc(git.branch)} · ${esc(git.head)}</div><div class="status-detail" title="${esc(git.subject)}">${esc(git.subject)}${title==='技能仓'?' · 标签 '+esc(git.tags||'无'):''}</div></article>`;
}
function roleCard(role){
  const rows=role.order.map((item,index)=>`<div class="model-row" tabindex="0" role="listitem" data-provider="${esc(item.provider)}" data-model="${esc(item.model)}" title="${esc(item.slot)}\n${esc(item.binding)}">
    <span class="order-no">${String(index+1).padStart(2,'0')}</span><span class="drag-handle" aria-hidden="true">⠿</span>
    <div class="row-main"><div class="model-line"><span class="model-name">${esc(item.model)}</span><span class="preferred">首选</span></div>
    <div class="meta"><span class="entry">${esc(item.entry)}</span><span>·</span><span class="provider">${esc(item.provider)}</span><span class="chip ${familyClass(item.family)}">${esc(item.family)}</span>${item.plan?`<span class="chip plan-chip" title="${esc(item.plan)}">账户计划</span>`:''}${item.multimodal?'<span class="chip">多模态</span>':''}</div></div>
    <div class="row-actions"><button type="button" class="move-btn" data-dir="-1" title="上移（Alt+↑）" aria-label="上移 ${esc(item.model)}">↑</button><button type="button" class="move-btn" data-dir="1" title="下移（Alt+↓）" aria-label="下移 ${esc(item.model)}">↓</button></div>
  </div>`).join('');
  return `<article class="role-card" data-role-card="${esc(role.role)}"><header class="role-head"><div><div class="role-title"><h3>${esc(role.title)}</h3><span class="level">${esc(role.level)}</span></div><div class="role-name">${esc(role.role)}</div></div><button type="button" class="save-state" data-state="saved" title="顺序已保存">已保存 ✓</button></header><div class="model-list" role="list" aria-label="${esc(role.title)}模型回退顺序">${rows}</div><footer class="card-foot"><span>从上到下依次回退</span><span>${role.order.length} 个候选</span></footer></article>`;
}
function render(state){
  if(drag) finishDrag(false);
  for(const rt of runtimes.values()){clearTimeout(rt.timer);rt.obsolete=true;}
  runtimes.clear();
  const valid=state.validate&&state.validate.code===0;
  $('v-badge').textContent=valid?'PASS':'FAIL';
  $('v-badge').className='badge '+(valid?'good':'bad');
  $('sub').textContent=`实测 ${state.now} · 账本 ${state.ledger.lines} 行 · 末行 ${state.ledger.lastRunId}`;
  const validationLine=String(state.validate.out||'').trim().split('\n').filter(Boolean).pop()||'';
  $('cards').innerHTML=statusCard('项目仓',state.project)+statusCard('技能仓',state.skill)+`<article class="status-card"><div class="status-top"><span>配置校验</span><span class="clean-state${valid?'':' dirty'}">${valid?'校验通过':'校验失败'}</span></div><div class="status-value">${valid?'PASS':'FAIL'}</div><div class="status-detail" title="${esc(state.validate.out)}">${esc(validationLine)}</div></article>`;
  $('roles').innerHTML=(state.roleGroups||state.roles.map(role=>({id:role.role,label:role.title,roles:[role]}))).map(group=>`<section class="role-group" data-role-group="${esc(group.id)}"><div class="section-head"><h2>${esc(group.label)}</h2></div><div class="roles-grid">${group.roles.map(roleCard).join('')}</div></section>`).join('');
  document.querySelectorAll('.role-card').forEach(card=>{
    const role=card.dataset.roleCard;
    const source=state.roles.find(item=>item.role===role);
    const providers=source.order.map(item=>item.provider);
    const rt={role,saved:[...providers],draft:[...providers],timer:null,busy:false,error:'',card,list:card.querySelector('.model-list'),obsolete:false};
    runtimes.set(role,rt);
    refreshRows(rt);
    setStatus(rt,'saved');
  });
}
async function load(message){
  try{render(await api('/api/state'));log(message||'状态已刷新。');return true;}
  catch(error){markDead();log('面板服务未运行或读取失败：'+error);return false;}
}
function setStatus(rt,state){
  const button=rt.card&&rt.card.querySelector('.save-state');
  if(!button)return;
  button.dataset.state=state;
  if(state==='saved'){button.textContent='已保存 ✓';button.title='顺序已保存';}
  else if(state==='saving'){button.textContent=rt.timer?'待保存…':'保存中…';button.title='正在保存最新顺序';}
  else{button.textContent='失败 ✗';button.title='点击查看失败原因';}
}
function refreshRows(rt){
  [...rt.list.children].forEach((row,index)=>{
    row.querySelector('.order-no').textContent=String(index+1).padStart(2,'0');
    row.querySelectorAll('.move-btn').forEach(button=>{button.disabled=(Number(button.dataset.dir)<0?index===0:index===rt.list.children.length-1);});
    row.setAttribute('aria-label',`${index+1} / ${rt.list.children.length}，${row.dataset.model}。按 Alt 加上下方向键调整顺序`);
  });
}
function afterReorder(rt){
  rt.draft=[...rt.list.children].map(row=>row.dataset.provider);
  refreshRows(rt);
  scheduleSave(rt);
}
function scheduleSave(rt){
  clearTimeout(rt.timer);rt.timer=null;
  if(sameOrder(rt.draft,rt.saved)){if(!rt.busy)setStatus(rt,'saved');return;}
  setStatus(rt,'saving');
  rt.timer=setTimeout(()=>{rt.timer=null;pumpSave(rt);},500);
}
async function pumpSave(rt){
  if(rt.obsolete||rt.busy)return;
  if(sameOrder(rt.draft,rt.saved)){setStatus(rt,'saved');return;}
  const sent=[...rt.draft];
  rt.busy=true;rt.error='';setStatus(rt,'saving');
  try{
    const result=await api('/api/order',{role:rt.role,order:sent});
    if(rt.obsolete||runtimes.get(rt.role)!==rt)return;
    if(result.ok){
      rt.saved=sent;rt.busy=false;
      const output=result.validate&&result.validate.out?'\n'+result.validate.out:'';
      log(`${rt.role} 顺序已保存。${output}`);
      if(sameOrder(rt.draft,rt.saved))setStatus(rt,'saved');else pumpSave(rt);
    }else{
      const reason=(result.validate&&result.validate.out)||result.error||'服务端拒绝了本次排序。';
      rt.busy=false;rt.error=reason;setStatus(rt,'error');
      await load(`${rt.role} 保存失败，已恢复服务端顺序。\n${reason}`);
      const fresh=runtimes.get(rt.role);if(fresh){fresh.error=reason;setStatus(fresh,'error');}
    }
  }catch(error){
    if(rt.obsolete)return;
    const reason=String(error);
    rt.busy=false;rt.error=reason;setStatus(rt,'error');
    await load(`${rt.role} 保存失败，已尝试恢复服务端顺序。\n${reason}`);
    const fresh=runtimes.get(rt.role);if(fresh){fresh.error=reason;setStatus(fresh,'error');}
  }
}
function animateRows(rows,first){
  if(reducedMotion.matches)return;
  for(const row of rows){
    const before=first.get(row);if(!before)continue;
    const dy=before.top-row.getBoundingClientRect().top;
    if(Math.abs(dy)>.5){row.getAnimations().forEach(a=>a.cancel());row.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'});}
  }
}
function moveRow(rt,row,direction){
  const rows=[...rt.list.children];const index=rows.indexOf(row);const target=index+direction;
  if(target<0||target>=rows.length)return;
  const first=new Map(rows.map(item=>[item,item.getBoundingClientRect()]));
  if(direction<0)rt.list.insertBefore(row,rows[target]);else rt.list.insertBefore(rows[target],row);
  animateRows(rows,first);afterReorder(rt);row.focus({preventScroll:true});
}
function beginDrag(){
  drag.active=true;
  drag.grabOffset=drag.y-drag.row.getBoundingClientRect().top;
  drag.row.classList.add('dragging');drag.list.classList.add('is-dragging');document.body.classList.add('is-dragging');
  updateDrag();drag.frame=requestAnimationFrame(dragLoop);
}
function updateDrag(){
  if(!drag||!drag.active)return;
  const {list,row,y}=drag;
  const others=[...list.children].filter(item=>item!==row);
  let target=others.findIndex(item=>y<item.getBoundingClientRect().top+item.getBoundingClientRect().height/2);
  if(target<0)target=others.length;
  const current=[...list.children].indexOf(row);
  const reference=others[target]||null;
  if(target!==current){
    const first=new Map(others.map(item=>[item,item.getBoundingClientRect()]));
    if(reference)list.insertBefore(row,reference);else list.appendChild(row);
    animateRows(others,first);
  }
  list.querySelectorAll('.drop-before,.drop-after').forEach(item=>item.classList.remove('drop-before','drop-after'));
  if(reference)reference.classList.add('drop-before');else if(others.length)others[others.length-1].classList.add('drop-after');
  const baseTop=list.getBoundingClientRect().top+row.offsetTop;
  const tilt=Math.max(-.45,Math.min(.45,(drag.x-drag.startX)*.008));
  row.style.transform=`translate3d(0,${y-drag.grabOffset-baseTop}px,0) scale(1.015) rotate(${tilt}deg)`;
}
function dragLoop(){
  if(!drag||!drag.active)return;
  const rect=drag.list.getBoundingClientRect();const edge=44;
  if(drag.y<rect.top+edge&&drag.y>rect.top-edge)drag.list.scrollTop-=4+10*Math.max(0,(rect.top+edge-drag.y)/edge);
  else if(drag.y>rect.bottom-edge&&drag.y<rect.bottom+edge)drag.list.scrollTop+=4+10*Math.max(0,(drag.y-rect.bottom+edge)/edge);
  updateDrag();drag.frame=requestAnimationFrame(dragLoop);
}
function finishDrag(commit=true){
  if(!drag)return;
  const current=drag;drag=null;cancelAnimationFrame(current.frame);
  try{if(current.row.hasPointerCapture(current.pointerId))current.row.releasePointerCapture(current.pointerId);}catch(e){}
  document.body.classList.remove('is-dragging');current.list.classList.remove('is-dragging');
  current.list.querySelectorAll('.drop-before,.drop-after').forEach(item=>item.classList.remove('drop-before','drop-after'));
  if(!current.active)return;
  updateDragFor(current);
  const row=current.row;
  const cleanup=()=>{row.classList.remove('dragging','settling');row.style.transform='';row.style.transition='';};
  if(reducedMotion.matches)cleanup();else{
    row.classList.replace('dragging','settling');row.style.transition='transform 190ms cubic-bezier(.2,.8,.2,1)';
    requestAnimationFrame(()=>{row.style.transform='translate3d(0,0,0)';});setTimeout(cleanup,200);
  }
  if(commit)afterReorder(runtimes.get(current.role));
}
function updateDragFor(old){drag=old;updateDrag();drag=null;}
$('roles').addEventListener('pointerdown',event=>{
  if(event.button!==0||drag)return;
  const row=event.target.closest('.model-row');if(!row||event.target.closest('.move-btn'))return;
  const card=row.closest('.role-card');const rt=runtimes.get(card.dataset.roleCard);if(!rt)return;
  row.focus({preventScroll:true});
  drag={pointerId:event.pointerId,row,list:rt.list,role:rt.role,startX:event.clientX,startY:event.clientY,x:event.clientX,y:event.clientY,active:false,frame:null,grabOffset:0};
  try{row.setPointerCapture(event.pointerId);}catch(e){}
  if(event.target.closest('.drag-handle')||event.pointerType==='mouse')event.preventDefault();
});
document.addEventListener('pointermove',event=>{
  if(!drag||event.pointerId!==drag.pointerId)return;
  drag.x=event.clientX;drag.y=event.clientY;
  if(!drag.active&&Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>4)beginDrag();
  if(drag.active)event.preventDefault();
},{passive:false});
document.addEventListener('pointerup',event=>{if(drag&&event.pointerId===drag.pointerId){drag.x=event.clientX;drag.y=event.clientY;finishDrag(true);}});
document.addEventListener('pointercancel',event=>{if(drag&&event.pointerId===drag.pointerId)finishDrag(true);});
$('roles').addEventListener('click',event=>{
  const move=event.target.closest('.move-btn');
  if(move){const row=move.closest('.model-row');const rt=runtimes.get(row.closest('.role-card').dataset.roleCard);moveRow(rt,row,Number(move.dataset.dir));return;}
  const status=event.target.closest('.save-state');
  if(status&&status.dataset.state==='error'){const rt=runtimes.get(status.closest('.role-card').dataset.roleCard);log(`${rt.role} 保存失败：\n${rt.error||'请刷新状态后重试。'}`);}
});
$('roles').addEventListener('keydown',event=>{
  const row=event.target.closest('.model-row');
  if(row&&event.altKey&&(event.key==='ArrowUp'||event.key==='ArrowDown')){event.preventDefault();const rt=runtimes.get(row.closest('.role-card').dataset.roleCard);moveRow(rt,row,event.key==='ArrowUp'?-1:1);}
});
async function action(id,pending,task){
  const button=$(id);button.disabled=true;log(pending);
  try{await task();}catch(error){markDead();log('操作失败：'+error);}finally{button.disabled=false;}
}
$('refresh').onclick=()=>action('refresh','刷新中…',()=>load());
$('health').onclick=()=>action('health','探测中（约数秒）…',async()=>{const result=await api('/api/health');log(result.out);});
$('sync').onclick=()=>action('sync','重渲染中…',async()=>{const result=await api('/api/sync');log('exit='+result.code+'\n'+result.out);});
load('状态已载入。拖动模型即可调整回退顺序。');
</script>
