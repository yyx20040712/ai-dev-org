<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevTroupe · 模型路由</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f9;--card:#fff;--text:#182230;--muted:#687586;--line:#dce2ea;--accent:#346ee6;--soft:#edf3ff;--danger:#bd3542;font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--card:#171e27;--text:#e7edf5;--muted:#98a5b5;--line:#2b3542;--accent:#8aadff;--soft:#1c2a40;--danger:#ff929b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}main{width:min(1080px,100%);margin:auto;padding:32px 20px 52px}header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}h1{margin:0;font-size:25px}h2{margin:0 0 4px;font-size:17px}p{margin:4px 0;color:var(--muted)}.local{font-size:12px;white-space:nowrap}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:inherit}button{border:1px solid var(--line);border-radius:7px;background:var(--card);padding:6px 10px;cursor:pointer}button:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}button:disabled{opacity:.35;cursor:default}.primary{background:var(--accent);color:#fff;border-color:transparent}.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.role{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;min-width:0}.role-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.role-head p{font-size:12px}.level{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}select{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:4px 6px}.routes{list-style:none;margin:14px 0 10px;padding:0;display:grid;gap:7px}.route{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px}.route:first-child{border-color:var(--accent);background:var(--soft)}.number{text-align:center;color:var(--muted);font-size:12px}.name{font-weight:650;overflow-wrap:anywhere}.model{color:var(--muted);font:11px ui-monospace,monospace;overflow-wrap:anywhere}.actions{display:flex;gap:3px}.actions button{padding:3px 7px}.add{display:flex;gap:7px}.add select{min-width:0;flex:1}.empty{color:var(--muted);padding:12px 0}.note{border-top:1px solid var(--line);margin-top:22px;padding-top:15px;font-size:12px}#log{white-space:pre-wrap;overflow-wrap:anywhere;min-height:24px;color:var(--muted)}.error{color:var(--danger)}@media(max-width:760px){.roles{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.route{grid-template-columns:20px minmax(0,1fr)}.actions{grid-column:2}}
</style>
</head>
<body>
<main>
<header><div><h1>DevTroupe 开发剧团</h1><p>主控做导演 · 五岗按需上场 · 顺序回退 · 无固定审核链</p></div><div class="local">仅 127.0.0.1 · 自动保存用户配置</div></header>
<div class="toolbar"><button class="primary" id="refresh">刷新</button><button id="sync">重新生成代理</button></div>
<div id="log" role="status">正在读取配置…</div>
<p id="path"></p>
<section class="roles" id="roles"></section>
<div class="note">顺序首项是首选模型。可添加、移除或上下移动槽位。配置或档位变化后，重新生成代理并新建会话才会生效；面板不会打开浏览器，也不会调用远程模型。</div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;
function log(message,error=false){$('log').textContent=message;$('log').className=error?'error':'';}
async function api(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined);const data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data;}
function render(){
  $('path').textContent=state.configPath;
  $('roles').innerHTML=state.roles.map(role=>{
    const used=role.routes.map(route=>route.slot);
    const available=state.slots.filter(slot=>!used.includes(slot.id)&&(role.role!=='vision'||slot.multimodal));
    const routes=role.routes.length?role.routes.map((route,index)=>`<li class="route"><span class="number">${index+1}</span><div><div class="name">${esc(route.agent)}</div><div class="model">${esc(route.model)} · ${esc(route.slot)}</div></div><div class="actions"><button data-action="up" data-role="${role.role}" data-slot="${route.slot}" ${index===0?'disabled':''} title="上移">↑</button><button data-action="down" data-role="${role.role}" data-slot="${route.slot}" ${index===role.routes.length-1?'disabled':''} title="下移">↓</button><button data-action="remove" data-role="${role.role}" data-slot="${route.slot}" title="从此角色移除">×</button></div></li>`).join(''):'<div class="empty">此角色已停用，没有模型槽位。</div>';
    return `<article class="role"><div class="role-head"><div><h2>${role.title} · ${role.role}</h2><p>${esc(role.description)}</p></div><label class="level">档位<select data-level="${role.role}">${state.levels.map(level=>`<option value="${level}" ${level===role.level?'selected':''}>${level}</option>`).join('')}</select></label></div><ul class="routes">${routes}</ul><div class="add"><select id="add-select-${role.role}" data-add-select="${role.role}">${available.map(slot=>`<option value="${slot.id}">${esc(slot.label||slot.id)} · ${esc(slot.id)}</option>`).join('')}</select><button data-action="add" data-role="${role.role}" ${available.length?'':'disabled'}>添加槽位</button></div></article>`;
  }).join('');
}
async function load(){state=await api('/api/state');render();log(`已加载 ${state.slots.length} 个模型槽位。`);}
async function saveRole(role,slots){const result=await api('/api/order',{role,slots});state=result.state;render();log(`${role} 的顺序已保存。`);}
$('roles').addEventListener('click',async event=>{
  const button=event.target.closest('button[data-action]');if(!button)return;
  const role=state.roles.find(item=>item.role===button.dataset.role);const slots=role.routes.map(route=>route.slot);const action=button.dataset.action;const slot=button.dataset.slot;const index=slots.indexOf(slot);
  try{
    if(action==='add'){const selected=$(`add-select-${role.role}`);await saveRole(role.role,[...slots,selected.value]);}
    if(action==='remove')await saveRole(role.role,slots.filter(id=>id!==slot));
    if((action==='up'||action==='down')&&index>=0){const next=action==='up'?index-1:index+1;[slots[index],slots[next]]=[slots[next],slots[index]];await saveRole(role.role,slots);}
  }catch(error){log(error.message,true);}
});
$('roles').addEventListener('change',async event=>{
  if(!event.target.dataset.level)return;
  try{const result=await api('/api/level',{role:event.target.dataset.level,level:event.target.value});state=result.state;render();log('思考档位已保存；请重新生成代理。');}catch(error){log(error.message,true);}
});
$('refresh').onclick=()=>load().catch(error=>log(error.message,true));
$('sync').onclick=async()=>{try{log('正在生成代理…');const {result}=await api('/api/sync',{});log(`已生成 ${result.generated} 份代理；写入 ${result.written.length}，移除 ${result.removed.length}。请新建会话。`);}catch(error){log(error.message,true);}};
load().catch(error=>log(error.message,true));
</script>
</body>
</html>
