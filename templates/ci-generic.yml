# CI 骨架（generic 兜底型）——ai-dev-org init-defenses 生成于 {{DATE}}
# 非 npm/pnpm 栈的项目：先手写 scripts/verify-generic.sh 里的 gate 清单，
# 再按栈换 runner/setup 步骤。骨架保证「入口存在且可跑」。
name: ci-defenses
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-generic.sh
