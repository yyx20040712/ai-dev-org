# CI 骨架（pnpm+py-gates 型）——ai-dev-org init-defenses 生成于 {{DATE}}
# Python 门禁=ruff/mypy/pytest（run_gates.py 探测执行）；按项目增删 job。
name: ci-defenses
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python scripts/run_gates.py
        env:
          DEFENSES_STRICT: '1'
